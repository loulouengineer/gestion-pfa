version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: projespring-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projespring
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projespring-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/projespring?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - projespring-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projespring-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - projespring-network

volumes:
  mysql_data:

networks:
  projespring-network:
    driver: bridge
